<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kodam Scanner</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body{ height:100%; background:#000; overflow:hidden; }
  body{ font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }

  .screen{ position:fixed; inset:0; transition: transform .4s cubic-bezier(.25,.9,.35,1); }

  /* ---------- SCREEN 1: KAMERA ---------- */
  #screenCamera{ background:#000; z-index:1; }
  .viewport{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  video{ width:100%; height:100%; object-fit:cover; display:block; transform: scaleX(-1); }

  .scan-line{
    position:fixed; left:0; right:0; height:3px;
    background:#fff; box-shadow:0 0 20px 4px rgba(255,255,255,0.8);
    top:0; display:none; z-index:2;
  }
  .scanning .scan-line{ display:block; animation: sweep 1s linear infinite; }
  @keyframes sweep{ 0%{ top:0% } 100%{ top:100% } }
  .scan-tint{
    position:fixed; inset:0; background:rgba(255,255,255,0); z-index:1; pointer-events:none;
    transition: background .2s ease;
  }
  .scanning .scan-tint{ background: rgba(120,255,180,0.08); }

  .top-bar{
    position:fixed; top:0; left:0; right:0; z-index:3;
    padding: calc(env(safe-area-inset-top, 16px) + 6px) 20px 14px;
    display:flex; justify-content:center;
    background: linear-gradient(180deg, rgba(0,0,0,0.55), transparent);
  }
  .top-bar span{ color:#fff; font-size:13px; font-weight:600; letter-spacing:.02em; opacity:.9; }

  .scan-status{
    position:fixed; top:50%; left:0; right:0; transform:translateY(-50%);
    text-align:center; color:#fff; font-size:13px; font-weight:600;
    letter-spacing:.15em; text-transform:uppercase; opacity:0; z-index:3;
    transition: opacity .2s ease;
  }
  .scanning .scan-status{ opacity:.85; }

  .controls{
    position:fixed; left:0; right:0; bottom:0; z-index:3;
    padding: 22px 24px calc(env(safe-area-inset-bottom, 18px) + 22px);
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(0deg, rgba(0,0,0,0.6), transparent);
  }
  .shutter{ width:74px; height:74px; border-radius:50%; background:transparent; border:4px solid #fff; padding:4px; cursor:pointer; }
  .shutter-inner{ width:100%; height:100%; border-radius:50%; background:#fff; transition: transform .15s ease; }
  .shutter:active .shutter-inner{ transform: scale(.82); }
  .shutter:disabled{ opacity:.4; }

  .error{ position:fixed; top:50%; left:20px; right:20px; transform:translateY(-50%); color:#fff; text-align:center; font-size:14px; opacity:.8; z-index:3; }

  /* ---------- SCREEN 2: HASIL ---------- */
  #screenResult{
    background:#0e0e0e;
    transform: translateY(100%);
    z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: calc(env(safe-area-inset-top,16px) + 20px) 24px calc(env(safe-area-inset-bottom,16px) + 24px);
  }
  #screenResult.show{ transform: translateY(0); }

  .result-title{ position:absolute; top: calc(env(safe-area-inset-top,16px) + 20px); color:#fff; font-size:13px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; opacity:.4; }

  .stage{
    position:relative;
    width:100%; max-width:300px; aspect-ratio:1/1;
    margin-bottom:22px;
  }
  .stage img{
    position:absolute; inset:0;
    width:100%; height:100%; object-fit:cover;
    border-radius:16px;
    opacity:0;
    transition: opacity .5s ease;
  }
  .stage img.show{ opacity:1; }

  /* placeholder kalau gambar catbox belum ditaruh / belum ketemu filenya */
  .catbox-placeholder{
    position:absolute; inset:0;
    border:10px solid #7a4a1f;
    border-radius:14px;
    box-shadow: inset 0 0 0 3px #5c3714;
    background:#1a1a1a;
    display:none;
    align-items:center; justify-content:center;
    text-align:center; color:#888; font-size:12px; padding:16px;
  }
  .catbox-placeholder.show{ display:flex; }

  .kodam-name{ color:#fff; font-size:19px; font-weight:700; text-align:center; margin-bottom:8px; }
  .kodam-desc{ color:#999; font-size:14px; line-height:1.6; text-align:center; margin-bottom:26px; max-width:300px; }

  .again{ width:100%; max-width:300px; padding:14px; border:none; border-radius:12px; background:#fff; color:#111; font-size:15px; font-weight:600; }
</style>
</head>
<body>

<!-- SCREEN 1: KAMERA -->
<div class="screen" id="screenCamera">
  <div class="viewport"><video id="video" autoplay playsinline muted></video></div>
  <div class="scan-tint"></div>
  <div class="scan-line"></div>
  <div class="top-bar"><span>Kodam Scanner</span></div>
  <div class="scan-status" id="scanStatus">MENGANALISIS AURA...</div>
  <div id="err" class="error"></div>
  <div class="controls">
    <button class="shutter" id="scanBtn" onclick="scan()"><div class="shutter-inner"></div></button>
  </div>
</div>

<!-- SCREEN 2: HASIL -->
<div class="screen" id="screenResult">
  <div class="result-title">Hasil Pemindaian</div>

  <div class="stage">
    <img id="selfiePhoto" src="" alt="foto kamu">
    <img id="catboxPhoto" src="" alt="wujud kodam">
    <div class="catbox-placeholder" id="catboxPlaceholder"></div>
  </div>

  <div class="kodam-name" id="kodamName"></div>
  <p class="kodam-desc" id="kodamDesc"></p>
  <button class="again" onclick="retry()">Scan Lagi</button>
</div>

<script>
/* =========================================================
   DAFTAR KODAM
   - "img" adalah path file catbox yang HARUS kamu siapkan sendiri.
   - Simpan semua gambar catbox di folder "catbox/" (sejajar dengan file HTML ini),
     dengan nama file PERSIS seperti di kolom "img" di bawah.
   - Kalau file gambarnya belum ada, otomatis muncul kotak placeholder
     coklat bertuliskan nama file yang harus kamu isi.
   - Tambah/ganti/hapus entri di array ini sesuka kamu.
========================================================= */
const KODAM_LIST = [
  { nama: "Kodam Harimau Kolor Seminggu Gak Dicuci", img: "catbox/harimau.png",
    desc: "Auranya nyengat dari radius 5 meter. Kalau kamu males ganti baju tapi ngerasa paling wangi sedunia, ini biangnya." },
  { nama: "Kodam Naga Kentut Diam-Diam Ngebul", img: "catbox/naga.png",
    desc: "Keluar tanpa suara tapi efeknya bikin satu lift kosong dalam sedetik. Kamu pura-pura liat HP padahal pelakunya." },
  { nama: "Kodam Garuda Iler Bantal Basah", img: "catbox/garuda.png",
    desc: "Titisan leluhur yang bikin kamu bangun tidur siang dengan bantal kayak abis kebanjiran." },
  { nama: "Kodam Kucing Oren Kerokan Sebelah", img: "catbox/kucing-oren.png",
    desc: "Bikin kamu garuk-garuk badan di tempat umum dengan pede maksimal, gak peduli orang liatin." },
  { nama: "Kodam Buaya Kaos Kaki Bau Terasi", img: "catbox/buaya.png",
    desc: "Sekali lepas sepatu, seisi ruangan langsung sepakat buka jendela tanpa dikomando." },
  { nama: "Kodam Kera Sakti Jerawat Pantat", img: "catbox/kera.png",
    desc: "Nongol pas lagi enak-enaknya duduk lama, bikin kamu geser posisi duduk 40 kali sejam." },
  { nama: "Kodam Elang Hitam Kentut Bau Nyaru Gorengan", img: "catbox/elang.png",
    desc: "Saking otentiknya orang di sebelah malah nanya 'itu bau gorengan dari mana ya'." },
  { nama: "Kodam Komodo Nafas Bangun Tidur", img: "catbox/komodo.png",
    desc: "Sekali buka mulut pagi hari, bisa bikin nyamuk semalaman kabur duluan." },
  { nama: "Kodam Lele Jumbo Sisa Nasi di Gigi", img: "catbox/lele.png",
    desc: "Bikin kamu senyum pede di foto grup padahal ada nasi nyempil dari makan siang tadi." },
  { nama: "Kodam Merak Ketek Bau Bawang Goreng", img: "catbox/merak.png",
    desc: "Auranya nempel di baju sampai tiga kali cuci, konon warisan turun-temurun." },
  { nama: "Kodam Ular Weling Upil Kering Nempel", img: "catbox/ular.png",
    desc: "Muncul pas video call penting, tapi kameranya sengaja nyorot dari bawah dagu." },
  { nama: "Kodam Singa Handuk Basah Seminggu", img: "catbox/singa.png",
    desc: "Bikin kamu lupa jemur handuk sampai baunya bisa dipakai buat pengusir tikus." },
  { nama: "Kodam Burung Hantu Ngiler Sambil Melek", img: "catbox/burung-hantu.png",
    desc: "Aktif pas rapat online, bikin kamu ketiduran duduk tegak dengan mulut nganga." },
  { nama: "Kodam Kalajengking Sendal Jepit Sebelah Ilang", img: "catbox/kalajengking.png",
    desc: "Sengatannya bikin satu sendal raib misterius, sebelahnya dipakai keliling rumah sampai lecek." },
  { nama: "Kodam Kambing Jantan Baju Dalam Kebalik", img: "catbox/kambing.png",
    desc: "Bikin kamu jalan seharian pede padahal baju dipakai belakang-depan sejak subuh." },
  { nama: "Kodam Kupu-Kupu Bantal Guling Bau Iler", img: "catbox/kupu-kupu.png",
    desc: "Sekali nempel, guling kesayanganmu resmi jadi barang bukti tidur sembilan jam nonstop." },
  { nama: "Kodam Tuyul Kolor Nyangkut di Kipas", img: "catbox/tuyul.png",
    desc: "Bikin jemuran kamu ilang sebelah tanpa jejak, ujung-ujungnya ketemu nyangkut di baling-baling kipas angin." },
  { nama: "Kodam Babi Ngepet Perut Buncit Abis Lebaran", img: "catbox/babi-ngepet.png",
    desc: "Sekali kerasukan, celana langsung sesak sendiri walau baru makan ketupat sepiring." }
];

const video = document.getElementById('video');
const scanBtn = document.getElementById('scanBtn');
const screenCamera = document.getElementById('screenCamera');
const screenResult = document.getElementById('screenResult');
const scanStatus = document.getElementById('scanStatus');
const err = document.getElementById('err');
const selfiePhoto = document.getElementById('selfiePhoto');
const catboxPhoto = document.getElementById('catboxPhoto');
const catboxPlaceholder = document.getElementById('catboxPlaceholder');

if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  err.textContent = "Browser ini gak support akses kamera lewat file lokal. Coba jalankan file-nya lewat server (http/https), bukan dibuka langsung.";
  scanBtn.disabled = true;
} else {
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
    .then(stream => { video.srcObject = stream; })
    .catch((e) => {
      let msg = "Gak bisa akses kamera (" + e.name + ").";
      if (e.name === "NotAllowedError") msg = "Izin kamera ditolak. Buka pengaturan situs di browser lalu izinkan Camera.";
      else if (e.name === "NotFoundError") msg = "Kamera gak ketemu di perangkat ini.";
      else if (e.name === "NotReadableError") msg = "Kamera lagi dipakai aplikasi lain. Tutup app lain yang pakai kamera.";
      else if (e.name === "SecurityError") msg = "Halaman ini harus dibuka lewat https:// atau localhost, bukan file lokal, biar kamera bisa aktif.";
      err.textContent = msg;
      scanBtn.disabled = true;
    });
}

function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

const scanMsgs = ["MENGANALISIS AURA...","MELACAK FREKUENSI GAIB...","MENCOCOKKAN LELUHUR...","HAMPIR SELESAI..."];

function scan(){
  scanBtn.disabled = true;
  screenCamera.classList.add('scanning');

  let mi = 0;
  const msgInterval = setInterval(()=>{
    mi = (mi+1) % scanMsgs.length;
    scanStatus.textContent = scanMsgs[mi];
  }, 450);

  setTimeout(()=>{
    clearInterval(msgInterval);
    screenCamera.classList.remove('scanning');

    // ambil foto dari video
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0);

    // reset state gambar
    selfiePhoto.classList.remove('show');
    catboxPhoto.classList.remove('show');
    catboxPlaceholder.classList.remove('show');
    selfiePhoto.src = canvas.toDataURL('image/jpeg');

    const kodam = pick(KODAM_LIST);
    document.getElementById('kodamName').textContent = kodam.nama;
    document.getElementById('kodamDesc').textContent = kodam.desc;

    screenResult.classList.add('show');

    // munculin foto selfie dulu
    requestAnimationFrame(()=> selfiePhoto.classList.add('show'));

    // setelah ~1.1 detik, foto selfie hilang, ganti gambar catbox si kodam
    setTimeout(()=>{
      selfiePhoto.classList.remove('show');

      // coba load gambar catbox; kalau gagal (belum ada filenya), tampilin placeholder
      const testImg = new Image();
      testImg.onload = () => {
        catboxPhoto.src = kodam.img;
        catboxPhoto.classList.add('show');
      };
      testImg.onerror = () => {
        catboxPlaceholder.textContent = "📦 taruh gambar di: " + kodam.img;
        catboxPlaceholder.classList.add('show');
      };
      testImg.src = kodam.img;

      scanBtn.disabled = false;
    }, 1100);

  }, 1800);
}

function retry(){
  screenResult.classList.remove('show');
}
</script>

</body>
</html>
