<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kodam Scanner</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body{ height:100%; background:#000; overflow:hidden; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }

  .viewport{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  video, img.shot{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  video.hidden, img.shot.hidden{ display:none; }
  /* mirror the live preview like a selfie camera */
  video{ transform: scaleX(-1); }

  .top-bar{
    position:fixed; top:0; left:0; right:0;
    padding: calc(env(safe-area-inset-top, 16px) + 6px) 20px 14px;
    display:flex; justify-content:center;
    background: linear-gradient(180deg, rgba(0,0,0,0.55), transparent);
  }
  .top-bar span{
    color:#fff; font-size:13px; font-weight:600; letter-spacing:.02em;
    opacity:.9;
  }

  .controls{
    position:fixed; left:0; right:0; bottom:0;
    padding: 22px 24px calc(env(safe-area-inset-bottom, 18px) + 22px);
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(0deg, rgba(0,0,0,0.6), transparent);
  }

  .shutter{
    width:74px; height:74px; border-radius:50%;
    background:transparent;
    border:4px solid #fff;
    padding:4px;
    cursor:pointer;
  }
  .shutter-inner{
    width:100%; height:100%; border-radius:50%; background:#fff;
    transition: transform .15s ease, border-radius .15s ease;
  }
  .shutter:active .shutter-inner{ transform: scale(.82); }
  .shutter:disabled{ opacity:.4; }

  .retake{
    position:fixed; bottom:0; left:0; right:0;
    padding: 22px 24px calc(env(safe-area-inset-bottom, 18px) + 22px);
    display:none; align-items:center; justify-content:center;
    background: linear-gradient(0deg, rgba(0,0,0,0.6), transparent);
  }
  .retake.show{ display:flex; }
  .retake button{
    background: rgba(255,255,255,0.14);
    color:#fff; border:1px solid rgba(255,255,255,0.3);
    padding:12px 22px; border-radius:30px;
    font-size:14px; font-weight:600;
    backdrop-filter: blur(6px);
  }

  .error{
    position:fixed; top:50%; left:20px; right:20px; transform:translateY(-50%);
    color:#fff; text-align:center; font-size:14px; opacity:.8;
  }

  /* bottom sheet with kodam result */
  .sheet{
    position:fixed; left:0; right:0; bottom:0;
    background:#fff; border-radius:20px 20px 0 0;
    padding: 22px 22px calc(env(safe-area-inset-bottom, 18px) + 22px);
    transform: translateY(100%);
    transition: transform .32s cubic-bezier(.25,.9,.35,1);
    box-shadow: 0 -8px 30px rgba(0,0,0,0.3);
  }
  .sheet.show{ transform: translateY(0); }
  .sheet-handle{
    width:36px; height:4px; background:#ddd; border-radius:2px;
    margin: 0 auto 16px;
  }
  .kodam-name{ font-size:18px; font-weight:700; color:#111; margin-bottom:6px; }
  .kodam-desc{ font-size:14px; color:#777; line-height:1.55; margin-bottom:18px; }
  .sheet button{
    width:100%; padding:14px; border:none; border-radius:12px;
    background:#111; color:#fff; font-size:15px; font-weight:600;
  }
</style>
</head>
<body>

<div class="viewport">
  <video id="video" autoplay playsinline muted></video>
  <img id="photo" class="shot hidden" alt="hasil scan">
</div>

<div class="top-bar"><span>Kodam Scanner</span></div>

<div id="err" class="error"></div>

<div class="controls" id="controls">
  <button class="shutter" id="scanBtn" onclick="scan()">
    <div class="shutter-inner"></div>
  </button>
</div>

<div class="retake" id="retakeBar">
  <button onclick="retry()">Ulangi</button>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="kodam-name" id="kodamName"></div>
  <p class="kodam-desc" id="kodamDesc"></p>
  <button onclick="retry()">Scan Lagi</button>
</div>

<script>
const video = document.getElementById('video');
const photo = document.getElementById('photo');
const scanBtn = document.getElementById('scanBtn');
const controls = document.getElementById('controls');
const retakeBar = document.getElementById('retakeBar');
const sheet = document.getElementById('sheet');
const err = document.getElementById('err');

navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
  .then(stream => { video.srcObject = stream; })
  .catch(() => { err.textContent = "Gak bisa akses kamera. Cek izin kamera di browser."; scanBtn.disabled = true; });

const jenis = ["Naga","Harimau","Garuda","Buaya Putih","Kera Sakti","Elang Hitam","Kucing Oren","Komodo","Singa","Lele Jumbo"];
const sifat = ["Api Kahyangan","Petir Selatan","Embun Subuh","Angin Puting Beliung","Cahaya Senja","Bara Merapi","Kabut Merapat","Taring Perak"];
const gelar = ["dari Gunung Kawi","Penunggu Warnet 24 Jam","Titisan Malam Jumat","Penjaga Portal Wifi","Sang Penakluk Deadline","Panglima Julid Sejagat"];
const deskripsi = [
  "Auranya keliatan dari kejauhan. Konon kalau lagi laper, seisi kulkas bisa tiba-tiba kosong sendiri.",
  "Sering muncul pas lagi presentasi penting, bikin suara tiba-tiba serak nggak jelas.",
  "Kalau kamu sering ketiban rejeki nomplok, ya karena ini biang keroknya.",
  "Suka aktif jam 2 pagi, bikin kamu tiba-tiba pengen makan indomie.",
  "Punya kebiasaan bikin kamu telat 5 menit di momen paling penting.",
  "Sering nyuruh kamu checkout keranjang belanja online jam 12 malam."
];
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

function scan(){
  scanBtn.disabled = true;

  setTimeout(()=>{
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    // mirror capture to match preview
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0);
    photo.src = canvas.toDataURL('image/jpeg');

    video.classList.add('hidden');
    photo.classList.remove('hidden');
    controls.style.display = 'none';

    document.getElementById('kodamName').textContent = `Kodam ${pick(jenis)} ${pick(sifat)} ${pick(gelar)}`;
    document.getElementById('kodamDesc').textContent = pick(deskripsi);

    sheet.classList.add('show');
  }, 250);
}

function retry(){
  sheet.classList.remove('show');
  photo.classList.add('hidden');
  video.classList.remove('hidden');
  controls.style.display = 'flex';
  scanBtn.disabled = false;
}
</script>

</body>
</html>
