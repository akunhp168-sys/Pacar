<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Mau Jadi Pacar Aku?</title>  <!-- Font Awesome -->  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">  <!-- Google Font -->  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --pink: #ff4f81;
      --pink-dark: #e9366b;
      --text: #25252b;
      --muted: #85858e;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Poppins", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #ffd6e4 0, transparent 30%),
        radial-gradient(circle at 80% 80%, #ffc4d9 0, transparent 30%),
        linear-gradient(135deg, #fff0f5, #ffdce8);
    }

    /* Background */
    .bg-heart {
      position: fixed;
      color: rgba(255, 79, 129, .12);
      font-size: 40px;
      animation: floating 6s linear infinite;
      pointer-events: none;
    }

    @keyframes floating {
      0% {
        transform: translateY(110vh) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateY(-120vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Card */
    .card {
      width: min(92%, 430px);
      padding: 38px 28px 32px;
      text-align: center;
      background: rgba(255, 255, 255, .82);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 30px;
      box-shadow:
        0 25px 70px rgba(180, 40, 90, .18),
        inset 0 1px 0 rgba(255, 255, 255, .9);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      position: relative;
      z-index: 5;
      animation: cardIn .7s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(25px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Icon */
    .icon-box {
      width: 78px;
      height: 78px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      color: white;
      font-size: 32px;
      background: linear-gradient(135deg, var(--pink), #ff82a7);
      box-shadow: 0 12px 30px rgba(255, 79, 129, .3);
      animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.07);
      }
    }

    h1 {
      color: var(--text);
      font-size: 27px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -.6px;
      margin-bottom: 12px;
    }

    .highlight {
      color: var(--pink);
    }

    .description {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    /* Buttons */
    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      position: relative;
    }

    button {
      border: 0;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 14px 24px;
      border-radius: 16px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
      white-space: nowrap;
    }

    #yes {
      color: white;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      box-shadow: 0 9px 22px rgba(255, 79, 129, .28);
    }

    #yes:hover {
      transform: translateY(-3px);
      box-shadow: 0 13px 27px rgba(255, 79, 129, .35);
    }

    #no {
      color: #555;
      background: #f1f1f4;
      position: relative;
    }

    #no:hover {
      background: #e8e8ec;
    }

    /* Success */
    .success {
      display: none;
    }

    .success .icon-box {
      background: linear-gradient(135deg, #ff477e, #ff9fbd);
    }

    .success h1 {
      color: var(--pink-dark);
    }

    .success-text {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      margin-top: 10px;
    }

    .signature {
      margin-top: 22px;
      color: var(--pink);
      font-size: 13px;
      font-weight: 600;
    }

    /* Floating hearts after YES */
    .love-heart {
      position: fixed;
      bottom: -40px;
      z-index: 20;
      pointer-events: none;
      color: var(--pink);
      animation: loveFloat 4s linear forwards;
    }

    @keyframes loveFloat {
      0% {
        transform: translateY(0) scale(.7) rotate(0);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        transform: translateY(-115vh) scale(1.5) rotate(25deg);
        opacity: 0;
      }
    }

    @media (max-width: 400px) {
      .card {
        padding: 32px 20px 28px;
      }

      h1 {
        font-size: 24px;
      }

      button {
        padding: 13px 20px;
      }
    }
  </style></head><body>  <!-- Background Hearts -->  <div class="bg-heart" style="left:8%; animation-delay:0s;">
    <i class="fa-solid fa-heart"></i>
  </div>  <div class="bg-heart" style="left:30%; animation-delay:2s;">
    <i class="fa-solid fa-heart"></i>
  </div>  <div class="bg-heart" style="left:65%; animation-delay:1s;">
    <i class="fa-solid fa-heart"></i>
  </div>  <div class="bg-heart" style="left:88%; animation-delay:3s;">
    <i class="fa-solid fa-heart"></i>
  </div>  <!-- Question -->  <main class="card" id="questionCard"><div class="icon-box">
  <i class="fa-solid fa-heart"></i>
</div>

<h1>
  Mau nggak jadi
  <span class="highlight">pacar aku?</span>
</h1>

<p class="description">
  Ada satu pertanyaan yang ingin aku tanyakan.
  Jawabannya mungkin sederhana,
  tapi berarti buat aku. 💗
</p>

<div class="buttons">
  <button id="yes">
    <i class="fa-solid fa-heart"></i>
    &nbsp; Ya, mau!
  </button>

  <button id="no">
    <i class="fa-solid fa-xmark"></i>
    &nbsp; Tidak
  </button>
</div>

  </main>  <!-- Success -->  <main class="card success" id="successCard"><div class="icon-box">
  <i class="fa-solid fa-heart-circle-check"></i>
</div>

<h1>
  Yeay! <span class="highlight">💗</span>
</h1>

<p class="success-text">
  Terima kasih sudah menjawab <b>“Ya”</b>.<br>
  Mulai sekarang, semoga kita bisa
  saling menjaga dan membuat banyak
  cerita indah bersama. ✨
</p>

<div class="signature">
  <i class="fa-solid fa-heart"></i>
  Dengan penuh rasa sayang
</div>

  </main>  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");

    const questionCard = document.getElementById("questionCard");
    const successCard = document.getElementById("successCard");

    let moveCount = 0;

    function moveNoButton() {
      moveCount++;

      const padding = 15;

      const maxX =
        window.innerWidth - noBtn.offsetWidth - padding;

      const maxY =
        window.innerHeight - noBtn.offsetHeight - padding;

      const x =
        Math.random() * Math.max(maxX - padding, padding)
        + padding;

      const y =
        Math.random() * Math.max(maxY - padding, padding)
        + padding;

      noBtn.style.position = "fixed";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";

      /* Setelah beberapa kali kabur,
         tombol berubah posisi lebih cepat */
      noBtn.style.transform =
        "rotate(" + (Math.random() * 10 - 5) + "deg)";
    }

    /* Desktop */
    noBtn.addEventListener("mouseenter", moveNoButton);

    /* Mobile */
    noBtn.addEventListener("touchstart", function(e) {
      e.preventDefault();
      moveNoButton();
    }, { passive: false });

    /* Kalau berhasil ditekan */
    noBtn.addEventListener("click", function(e) {
      e.preventDefault();
      moveNoButton();
    });

    /* YES */
    yesBtn.addEventListener("click", function() {

      questionCard.style.display = "none";
      successCard.style.display = "block";

      createHearts();
    });

    function createHearts() {

      for (let i = 0; i < 45; i++) {

        setTimeout(() => {

          const heart = document.createElement("div");

          heart.className = "love-heart";

          const icons = [
            "fa-heart",
            "fa-heart",
            "fa-heart-circle-check",
            "fa-star"
          ];

          const randomIcon =
            icons[Math.floor(Math.random() * icons.length)];

          heart.innerHTML =
            `<i class="fa-solid ${randomIcon}"></i>`;

          heart.style.left =
            Math.random() * 100 + "vw";

          heart.style.fontSize =
            (14 + Math.random() * 22) + "px";

          heart.style.animationDuration =
            (3 + Math.random() * 3) + "s";

          document.body.appendChild(heart);

          setTimeout(() => {
            heart.remove();
          }, 6500);

        }, i * 80);
      }
    }
  </script></body>
</html>
